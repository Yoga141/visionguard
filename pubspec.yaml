name: visionguard
description: "VisionGuard - deteksi dini kelelahan mata digital berbasis computer vision."
publish_to: 'none'
version: 0.3.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management (SDD Tabel 3.1)
  flutter_riverpod: ^2.6.1
  # Navigasi antarhalaman
  go_router: ^14.8.1
  # Akses kamera (CameraSource)
  camera: ^0.11.1
  camera_windows: ^0.3.0

  # Firebase (Auth & Firestore)
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5

  # Gemini AI (asisten kesehatan mata)
  google_generative_ai: ^0.4.6
  flutter_dotenv: ^6.0.1

  # --- Tahap berikutnya (belum dipakai di progress 30%) ---
  # tflite_flutter: ^0.11.0          # runtime MediaPipe Face Landmarker
  # drift: ^2.22.0                   # SQLite lokal (kalibrasi, metrik)
  # flutter_local_notifications: ^18.0.0
  # dio: ^5.7.0                      # REST API Laravel

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
