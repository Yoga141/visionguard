name: visionguard
description: "VisionGuard - deteksi dini kelelahan mata digital berbasis computer vision."
publish_to: 'none'
version: 0.3.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management (SDD Tabel 3.1)
  flutter_riverpod: ^2.6.1
  # Navigasi antarhalaman
  go_router: ^14.8.1
  # Akses kamera (CameraSource)
  camera: ^0.11.1
  camera_windows: ^0.3.0

  # Lapisan jaringan ke REST API Laravel + token Sanctum (SDD 3.2)
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0

  # Gemini AI — fitur tambahan "Saran AI" (DOCS_SPEC §17)
  google_generative_ai: ^0.4.6
  flutter_dotenv: ^6.0.1

  # SQLite lokal: kalibrasi, sesi, metrik, pengingat, pengaturan (DOCS_SPEC §12.3)
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6

  # Notifikasi sistem pengingat (Windows & Android) dengan aksi Tunda (§4.2, S-06)
  flutter_local_notifications: ^22.3.3

  # --- Tahap berikutnya (belum dipakai) ---
  # tflite_flutter: ^0.11.0          # runtime MediaPipe Face Landmarker

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Generator kode drift: dart run build_runner build
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  assets:
    - .env
