name: visionguard
description: "VisionGuard - deteksi dini kelelahan mata digital berbasis computer vision."
publish_to: 'none'
version: 0.3.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management (SDD Tabel 3.1)
  flutter_riverpod: ^2.6.1
  # Navigasi antarhalaman
  go_router: ^14.8.1
  # Akses kamera (CameraSource)
  camera: ^0.11.1
  camera_windows: ^0.3.0

  # Lapisan jaringan ke REST API Laravel + token Sanctum (SDD 3.2)
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  # Membuka halaman pembayaran Midtrans Snap di browser (UC-19, KRD-02)
  url_launcher: ^6.3.3

  # Gemini AI — fitur tambahan "Saran AI" (DOCS_SPEC §17). Panggilan langsung
  # dari klien HANYA untuk debug (key lewat --dart-define=GEMINI_API_KEY);
  # bawaan lewat backend POST /ai/advice.
  google_generative_ai: ^0.4.6

  # SQLite lokal: kalibrasi, sesi, metrik, pengingat, pengaturan (DOCS_SPEC §12.3)
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6

  # Notifikasi sistem pengingat (Windows & Android) dengan aksi Tunda (§4.2, S-06)
  flutter_local_notifications: ^22.3.3

  # Grafik tren 7 & 30 hari di halaman Statistik (S-08, STK-02)
  fl_chart: ^1.3.0

  # Runtime TFLite/LiteRT untuk MediaPipe Face Landmarker (DOCS_SPEC §4.2, Tahap D)
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Generator kode drift: dart run build_runner build
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  # Model MediaPipe Face Landmarker (Apache 2.0), lihat README.md
  assets:
    - assets/models/face_detector.tflite
    - assets/models/face_landmarks_detector.tflite
